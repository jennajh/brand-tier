<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodwill Brand Tier Lookup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    .hidden { display: none !important; }

    /* Header */
    .header {
      width: 100%;
      max-width: 36rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1e293b;
    }
    .brand-dot {
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 9999px;
      background-color: #00539B;
      display: inline-block;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0.25rem 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }
    .link-btn:hover { color: #0f172a; }

    /* Main */
    .main {
      flex: 1;
      width: 100%;
      max-width: 36rem;
      margin: 0 auto;
      padding: 1rem 1rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Search */
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.25rem;
      height: 1.25rem;
      color: #94a3b8;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 1rem 3rem;
      font-size: 1.125rem;
      font-weight: 500;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: #00539B;
      box-shadow: 0 0 0 4px rgba(0, 83, 155, 0.12);
    }
    .clear-btn {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      border-radius: 9999px;
      border: none;
      background: #f1f5f9;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .clear-btn:hover { background: #e2e8f0; color: #0f172a; }

    /* Tier Colors */
    .tier-good { background-color: #f1f5f9; color: #334155; border-color: #cbd5e1; }
    .tier-better { background-color: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .tier-best { background-color: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .tier-specialty { background-color: #fdf4ff; color: #86198f; border-color: #f0abfc; }

    .badge-good { background-color: #475569; color: #ffffff; }
    .badge-better { background-color: #2563eb; color: #ffffff; }
    .badge-best { background-color: #059669; color: #ffffff; }
    .badge-specialty { background-color: #9333ea; color: #ffffff; }

    /* Hero Result Card */
    .result-card {
      border-width: 2px;
      border-style: solid;
      border-radius: 1.5rem;
      padding: 1.5rem 1.25rem;
      text-align: center;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 0.75rem;
    }
    .edit-link {
      background: none;
      border: none;
      color: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    .tier-pill-lg {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      font-size: 1.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0.25rem 0 0.75rem;
    }
    .result-def {
      font-size: 0.875rem;
      line-height: 1.45;
      margin: 0 auto;
      max-width: 26rem;
      opacity: 0.9;
    }
    .result-note {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.375rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.65);
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Not Found */
    .not-found-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 1.5rem;
      text-align: center;
    }
    .not-found-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .not-found-title { margin: 0.5rem 0 0.25rem; font-size: 1.25rem; font-weight: 700; }
    .not-found-sub { margin: 0 0 1rem; font-size: 0.875rem; color: #64748b; }

    /* Tier Grid (Empty State) */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.625rem;
    }
    @media (min-width: 520px) {
      .tier-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .tier-tile {
      border-width: 1px;
      border-style: solid;
      border-radius: 1rem;
      padding: 0.875rem;
      text-align: left;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .tier-tile.active { box-shadow: 0 0 0 2px #0f172a; }
    .tier-tile-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .tier-tile-count { font-size: 1.375rem; font-weight: 800; margin-top: 0.15rem; }

    /* Lists */
    .card-list {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      overflow: hidden;
    }
    .card-list-header {
      padding: 0.625rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .list-scroll { max-height: 20rem; overflow-y: auto; }
    .list-row {
      width: 100%;
      background: #ffffff;
      border: none;
      border-bottom: 1px solid #f1f5f9;
      padding: 0.6875rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: #1e293b;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background-color: #f8fafc; }
    .badge-sm {
      padding: 0.1875rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Buttons */
    .btn-primary {
      background-color: #00539B;
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background-color: #00427c; }
    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid #e2e8f0;
      border-radius: 0.625rem;
      padding: 0.4375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #f8fafc; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      width: 100%;
      max-width: 26rem;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }
    .modal-head {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { margin: 0; font-size: 0.875rem; font-weight: 700; }
    .modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.875rem; }
    .field-label { display: block; font-size: 0.75rem; font-weight: 600; color: #334155; margin-bottom: 0.25rem; }
    .field-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      background: #ffffff;
      outline: none;
    }
    .field-input:focus { border-color: #00539B; box-shadow: 0 0 0 3px rgba(0, 83, 155, 0.12); }

    .guide-item {
      border-width: 1px;
      border-style: solid;
      border-radius: 0.75rem;
      padding: 0.75rem;
    }
    .guide-item p { margin: 0.375rem 0 0; font-size: 0.8125rem; line-height: 1.4; }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand-title">
      <span class="brand-dot"></span>
      <span>Goodwill Brand Tier</span>
    </div>
    <div class="header-actions">
      <button id="btnTierGuide" type="button" class="link-btn">Tier Guide</button>
      <button id="btnManage" type="button" class="link-btn">Manage</button>
    </div>
  </header>

  <main class="main">
    <div class="search-wrap">
      <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
      </svg>
      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Type a brand name..."
        class="search-input"
      />
      <button id="btnClearSearch" type="button" aria-label="Clear search" class="clear-btn hidden">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <section id="resultArea"></section>
    <section id="otherMatchesArea" class="hidden"></section>
    <section id="browseArea" class="hidden"></section>
  </main>

  <!-- Tier Guide Modal -->
  <div id="tierGuideModal" class="hidden modal-backdrop">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title">Quality Tier Guide</h2>
        <button id="btnCloseTierGuide" type="button" class="link-btn">Close</button>
      </div>
      <div class="modal-body" id="tierGuideContent"></div>
    </div>
  </div>

  <!-- Manage Modal -->
  <div id="manageModal" class="hidden modal-backdrop">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title">Manage Brands</h2>
        <button id="btnCloseManage" type="button" class="link-btn">Close</button>
      </div>
      <div class="modal-body">
        <button id="btnOpenAddBrand" type="button" class="btn-primary">+ Add Custom Brand</button>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid #f1f5f9;">
          <span id="manageCountLabel" style="font-size:12px;color:#64748b;">312 brands loaded</span>
          <div style="display:flex;gap:8px;">
            <button id="btnExportCsv" type="button" class="btn-secondary">Export CSV</button>
            <label class="btn-secondary" style="display:inline-block;">
              Import CSV
              <input id="csvFileInput" type="file" accept=".csv,text/csv" class="hidden" />
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Brand Modal -->
  <div id="brandFormModal" class="hidden modal-backdrop">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="brandFormTitle" class="modal-title">Add Brand</h2>
        <button id="btnCloseBrandForm" type="button" class="link-btn">Close</button>
      </div>
      <form id="brandForm" class="modal-body">
        <input type="hidden" id="editBrandId" value="" />
        <div>
          <label for="inputBrandName" class="field-label">Brand Name</label>
          <input id="inputBrandName" type="text" required placeholder="e.g., Patagonia" class="field-input" />
        </div>
        <div>
          <label for="inputBrandTier" class="field-label">Quality Tier</label>
          <select id="inputBrandTier" required class="field-input">
            <option value="Good">Good</option>
            <option value="Better">Better</option>
            <option value="Best">Best</option>
            <option value="Specialty">Specialty</option>
          </select>
        </div>
        <div>
          <label for="inputBrandNotes" class="field-label">Notes (optional)</label>
          <input id="inputBrandNotes" type="text" placeholder="Optional pricing note" class="field-input" />
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:4px;">
          <button id="btnCancelBrandForm" type="button" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="hidden toast"></div>

: 141, "brand": "Zoo York", "tier": "Better", "notes": "", "custom": false}];

    let state = {
      brands: [],
      search: "",
      selectedId: null,
      browseTier: null
    };

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .replace(/&/g, " and ")
        .replace(/['’`".\-_/]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadState() {
      let overrides = {};
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CUSTOM);
        if (raw) overrides = JSON.parse(raw);
      } catch (e) {}

      const merged = DEFAULT_BRANDS.map((b) => {
        const ov = overrides[String(b.id)];
        return ov ? { ...b, ...ov } : { ...b };
      });
      const customAdditions = Array.isArray(overrides._added) ? overrides._added : [];
      state.brands = [...merged, ...customAdditions];
    }

    function saveOverrides() {
      const overrides = { _added: [] };
      const defaultMap = new Map(DEFAULT_BRANDS.map((b) => [b.id, b]));
      for (const b of state.brands) {
        if (b.custom && !defaultMap.has(b.id)) {
          overrides._added.push(b);
        } else {
          const orig = defaultMap.get(b.id);
          if (orig && (orig.brand !== b.brand || orig.tier !== b.tier || orig.notes !== b.notes)) {
            overrides[String(b.id)] = { brand: b.brand, tier: b.tier, notes: b.notes, edited: true };
          }
        }
      }
      try {
        localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(overrides));
      } catch (e) {}
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    function scoreMatch(brandName, queryNorm) {
      const nameNorm = normalizeText(brandName);
      if (!queryNorm) return 0;
      if (nameNorm === queryNorm) return 100;
      if (nameNorm.startsWith(queryNorm)) return 80;
      if (nameNorm.split(" ").some((w) => w.startsWith(queryNorm))) return 60;
      if (nameNorm.includes(queryNorm)) return 40;
      return 0;
    }

    function getMatches() {
      const qNorm = normalizeText(state.search);
      if (!qNorm) return [];
      const matches = state.brands.filter((b) => scoreMatch(b.brand, qNorm) > 0);
      matches.sort((a, b) => {
        const sa = scoreMatch(a.brand, qNorm);
        const sb = scoreMatch(b.brand, qNorm);
        if (sb !== sa) return sb - sa;
        return a.brand.localeCompare(b.brand);
      });
      return matches;
    }

    function getTierClasses(tier) {
      const k = (tier || "Good").toLowerCase();
      return { card: `tier-${k}`, badge: `badge-${k}` };
    }

    function render() {
      const q = state.search.trim();
      document.getElementById("btnClearSearch").classList.toggle("hidden", state.search.length === 0);
      document.getElementById("manageCountLabel").textContent = `${state.brands.length} brands loaded`;

      const resultArea = document.getElementById("resultArea");
      const otherArea = document.getElementById("otherMatchesArea");
      const browseArea = document.getElementById("browseArea");

      const matches = getMatches();
      let activeBrand = null;
      if (state.selectedId !== null) {
        activeBrand = state.brands.find((b) => b.id === state.selectedId) || null;
      } else if (matches.length > 0) {
        activeBrand = matches[0];
      }

      if (!q && !activeBrand) {
        otherArea.classList.add("hidden");
        const counts = { Good: 0, Better: 0, Best: 0, Specialty: 0 };
        for (const b of state.brands) {
          if (counts[b.tier] !== undefined) counts[b.tier]++;
        }

        resultArea.innerHTML = `
          <div class="tier-grid">
            ${["Good", "Better", "Best", "Specialty"]
              .map((t) => {
                const cls = getTierClasses(t);
                const isActive = state.browseTier === t;
                return `
                  <button
                    type="button"
                    data-browse-tier="${t}"
                    class="tier-tile ${cls.card} ${isActive ? "active" : ""}"
                  >
                    <div class="tier-tile-label">${t}</div>
                    <div class="tier-tile-count">${counts[t]}</div>
                  </button>
                `;
              })
              .join("")}
          </div>
        `;

        if (state.browseTier) {
          const list = state.brands
            .filter((b) => b.tier === state.browseTier)
            .sort((a, b) => a.brand.localeCompare(b.brand));
          browseArea.classList.remove("hidden");
          browseArea.innerHTML = `
            <div class="card-list">
              <div class="card-list-header">
                <span>${state.browseTier} (${list.length})</span>
                <button id="btnCloseBrowse" type="button" class="link-btn">Close</button>
              </div>
              <div class="list-scroll">
                ${list
                  .map(
                    (b) => `
                    <button type="button" data-pick-id="${b.id}" class="list-row">
                      <span>${escapeHtml(b.brand)}</span>
                      <span style="font-size:12px;color:#94a3b8;">Select</span>
                    </button>
                  `
                  )
                  .join("")}
              </div>
            </div>
          `;
        } else {
          browseArea.classList.add("hidden");
          browseArea.innerHTML = "";
        }
        return;
      }

      browseArea.classList.add("hidden");

      if (!activeBrand && q) {
        otherArea.classList.add("hidden");
        resultArea.innerHTML = `
          <div class="not-found-card">
            <span class="not-found-badge">Not in list</span>
            <h2 class="not-found-title">"${escapeHtml(q)}"</h2>
            <p class="not-found-sub">Judge case-by-case using the Tier Guide, or save it locally.</p>
            <button id="btnAddMissing" type="button" class="btn-primary">+ Add "${escapeHtml(q)}"</button>
          </div>
        `;
        document.getElementById("btnAddMissing").addEventListener("click", () => openBrandModal(null, q));
        return;
      }

      const cls = getTierClasses(activeBrand.tier);
      resultArea.innerHTML = `
        <div class="result-card ${cls.card}">
          <div class="result-top">
            <span>${escapeHtml(activeBrand.brand)}</span>
            <button id="btnEditActive" type="button" class="edit-link">Edit</button>
          </div>
          <div>
            <span class="tier-pill-lg ${cls.badge}">${escapeHtml(activeBrand.tier)}</span>
          </div>
          <p class="result-def">${escapeHtml(TIER_DEFINITIONS[activeBrand.tier] || "")}</p>
          ${activeBrand.notes ? `<div class="result-note">${escapeHtml(activeBrand.notes)}</div>` : ""}
        </div>
      `;
      document.getElementById("btnEditActive").addEventListener("click", () => openBrandModal(activeBrand.id));

      const others = matches.filter((b) => b.id !== activeBrand.id).slice(0, 6);
      if (others.length > 0) {
        otherArea.classList.remove("hidden");
        otherArea.innerHTML = `
          <div class="card-list">
            ${others
              .map((b) => {
                const bCls = getTierClasses(b.tier);
                return `
                  <button type="button" data-pick-id="${b.id}" class="list-row">
                    <span>${escapeHtml(b.brand)}</span>
                    <span class="badge-sm ${bCls.badge}">${escapeHtml(b.tier)}</span>
                  </button>
                `;
              })
              .join("")}
          </div>
        `;
      } else {
        otherArea.classList.add("hidden");
        otherArea.innerHTML = "";
      }
    }

    function openBrandModal(brandId = null, prefillName = "") {
      const modal = document.getElementById("brandFormModal");
      const title = document.getElementById("brandFormTitle");
      const idInput = document.getElementById("editBrandId");
      const nameInput = document.getElementById("inputBrandName");
      const tierInput = document.getElementById("inputBrandTier");
      const notesInput = document.getElementById("inputBrandNotes");

      if (brandId !== null) {
        const b = state.brands.find((x) => x.id === brandId);
        if (!b) return;
        title.textContent = "Edit Brand";
        idInput.value = String(b.id);
        nameInput.value = b.brand;
        tierInput.value = b.tier;
        notesInput.value = b.notes || "";
      } else {
        title.textContent = "Add Brand";
        idInput.value = "";
        nameInput.value = prefillName;
        tierInput.value = "Better";
        notesInput.value = "";
      }
      modal.classList.remove("hidden");
      nameInput.focus();
    }

    function closeBrandModal() {
      document.getElementById("brandFormModal").classList.add("hidden");
    }

    function renderTierGuide() {
      document.getElementById("tierGuideContent").innerHTML = ["Good", "Better", "Best", "Specialty"]
        .map((t) => {
          const cls = getTierClasses(t);
          return `
            <div class="guide-item ${cls.card}">
              <span class="badge-sm ${cls.badge}" style="text-transform:uppercase;">${t}</span>
              <p>${escapeHtml(TIER_DEFINITIONS[t])}</p>
            </div>
          `;
        })
        .join("");
    }

    function exportCatalogCsv() {
      const header = ["Brand", "Tier", "Notes"];
      const rows = state.brands.map((b) => [
        `"${(b.brand || "").replace(/"/g, '""')}"`,
        `"${(b.tier || "").replace(/"/g, '""')}"`,
        `"${(b.notes || "").replace(/"/g, '""')}"`
      ]);
      const csv = [header.join(","), ...rows.map((r) => r.join(","))].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "goodwill_brand_tiers_export.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Exported CSV");
    }

    function parseCsvLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function handleCsvImport(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const lines = String(ev.target.result || "").split(/\r?\n/).filter((l) => l.trim().length > 0);
        if (lines.length < 2) {
          showToast("CSV is empty");
          return;
        }
        const validTiers = new Set(["Good", "Better", "Best", "Specialty"]);
        const imported = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          const brand = (cols[0] || "").trim();
          const tierRaw = (cols[1] || "").trim();
          const tier = validTiers.has(tierRaw) ? tierRaw : "Good";
          const notes = (cols[2] || "").trim();
          if (brand) imported.push({ id: 10000 + i, brand, tier, notes, custom: true });
        }
        if (imported.length === 0) {
          showToast("No valid rows found");
          return;
        }
        state.brands = imported;
        state.selectedId = null;
        saveOverrides();
        document.getElementById("manageModal").classList.add("hidden");
        render();
        showToast(`Imported ${imported.length} brands`);
      };
      reader.readAsText(file);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadState();
      renderTierGuide();
      render();

      const searchInput = document.getElementById("searchInput");
      searchInput.focus();

      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value;
        state.selectedId = null;
        state.browseTier = null;
        render();
      });

      document.getElementById("btnClearSearch").addEventListener("click", () => {
        state.search = "";
        state.selectedId = null;
        searchInput.value = "";
        searchInput.focus();
        render();
      });

      document.addEventListener("click", (e) => {
        const tierBtn = e.target.closest("[data-browse-tier]");
        if (tierBtn) {
          const t = tierBtn.getAttribute("data-browse-tier");
          state.browseTier = state.browseTier === t ? null : t;
          render();
          return;
        }
        if (e.target.closest("#btnCloseBrowse")) {
          state.browseTier = null;
          render();
          return;
        }
        const pickBtn = e.target.closest("[data-pick-id]");
        if (pickBtn) {
          state.selectedId = Number(pickBtn.getAttribute("data-pick-id"));
          const b = state.brands.find((x) => x.id === state.selectedId);
          if (b) {
            state.search = b.brand;
            searchInput.value = b.brand;
          }
          render();
        }
      });

      document.getElementById("btnTierGuide").addEventListener("click", () => {
        document.getElementById("tierGuideModal").classList.remove("hidden");
      });
      document.getElementById("btnCloseTierGuide").addEventListener("click", () => {
        document.getElementById("tierGuideModal").classList.add("hidden");
      });
      document.getElementById("tierGuideModal").addEventListener("click", (e) => {
        if (e.target.id === "tierGuideModal") document.getElementById("tierGuideModal").classList.add("hidden");
      });

      document.getElementById("btnManage").addEventListener("click", () => {
        document.getElementById("manageModal").classList.remove("hidden");
      });
      document.getElementById("btnCloseManage").addEventListener("click", () => {
        document.getElementById("manageModal").classList.add("hidden");
      });
      document.getElementById("manageModal").addEventListener("click", (e) => {
        if (e.target.id === "manageModal") document.getElementById("manageModal").classList.add("hidden");
      });
      document.getElementById("btnOpenAddBrand").addEventListener("click", () => {
        document.getElementById("manageModal").classList.add("hidden");
        openBrandModal(null, state.search.trim());
      });

      document.getElementById("btnCloseBrandForm").addEventListener("click", closeBrandModal);
      document.getElementById("btnCancelBrandForm").addEventListener("click", closeBrandModal);
      document.getElementById("brandFormModal").addEventListener("click", (e) => {
        if (e.target.id === "brandFormModal") closeBrandModal();
      });

      document.getElementById("brandForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const idRaw = document.getElementById("editBrandId").value;
        const brand = document.getElementById("inputBrandName").value.trim();
        const tier = document.getElementById("inputBrandTier").value;
        const notes = document.getElementById("inputBrandNotes").value.trim();
        if (!brand) return;

        if (idRaw) {
          const id = Number(idRaw);
          const idx = state.brands.findIndex((x) => x.id === id);
          if (idx !== -1) {
            state.brands[idx] = { ...state.brands[idx], brand, tier, notes, edited: true };
            state.selectedId = id;
          }
          showToast(`Updated ${brand} → ${tier}`);
        } else {
          const newId = Date.now();
          state.brands.unshift({ id: newId, brand, tier, notes, custom: true });
          state.selectedId = newId;
          state.search = brand;
          searchInput.value = brand;
          showToast(`Added ${brand} (${tier})`);
        }
        saveOverrides();
        closeBrandModal();
        render();
      });

      document.getElementById("btnExportCsv").addEventListener("click", exportCatalogCsv);
      document.getElementById("csvFileInput").addEventListener("change", (e) => {
        handleCsvImport(e.target.files[0]);
        e.target.value = "";
      });

      document.addEventListener("keydown", (e) => {
        const activeTag = document.activeElement ? document.activeElement.tagName : "";
        if (e.key === "/" && activeTag !== "INPUT" && activeTag !== "TEXTAREA") {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === "Escape") {
          document.getElementById("tierGuideModal").classList.add("hidden");
          document.getElementById("manageModal").classList.add("hidden");
          closeBrandModal();
          if (activeTag === "INPUT" && state.search) {
            state.search = "";
            state.selectedId = null;
            searchInput.value = "";
            render();
          }
        }
      });
    });
  </script>
